# ===================================
# Phuong Store - Application Config
# ===================================
spring.application.name=phuongstore

# --- Database (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/phuongstore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=shizadon2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=8080

# --- Jackson ---
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Security / JWT ---
jwt.secret=phuongstore_super_secure_jwt_secret_key_2026_at_least_256_bits_long!!
jwt.expiration-ms=86400000
jwt.remember-me-expiration-ms=604800000

# --- Serve Angular static files ---
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**