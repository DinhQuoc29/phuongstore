<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo-badge">
        <span class="login-logo">🛍️</span>
      </div>
      <h1 class="login-title">Phương Store</h1>
      <p class="login-subtitle">Hệ thống Quản lý Đơn hàng</p>
    </div>

    @if (errorMessage) {
      <div class="login-error-alert" role="alert">
        <span class="login-error-icon">⚠️</span>
        <span class="login-error-text">{{ errorMessage }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username" class="form-label">Tên đăng nhập</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input
            id="username"
            name="username"
            type="text"
            class="form-control"
            placeholder="Nhập tên đăng nhập"
            [(ngModel)]="username"
            [disabled]="loading"
            required
            autocomplete="username"
            autofocus
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Mật khẩu</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            id="password"
            name="password"
            type="password"
            class="form-control"
            placeholder="Nhập mật khẩu"
            [(ngModel)]="password"
            [disabled]="loading"
            required
            autocomplete="current-password"
          />
        </div>
      </div>

      <div class="form-actions-row">
        <label class="remember-me-label">
          <input
            type="checkbox"
            name="rememberMe"
            [(ngModel)]="rememberMe"
            [disabled]="loading"
            class="remember-me-checkbox"
          />
          <span>Ghi nhớ đăng nhập</span>
        </label>
      </div>

      <button
        type="submit"
        class="btn-submit"
        [disabled]="loading"
      >
        @if (loading) {
          <span class="spinner"></span>
          <span>Đang xác thực...</span>
        } @else {
          <span>Đăng nhập hệ thống</span>
        }
      </button>
    </form>
  </div>
</div>
